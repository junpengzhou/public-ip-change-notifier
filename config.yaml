# Poll all configured servers once per minute.
interval_seconds: 60

# The directory is created automatically on the first successful cycle.
state_file: "./data/public-ip-state.json"

teams:
  # Set this value or use PUBLIC_IP_NOTIFIER_TEAMS_WEBHOOK_URL.
  webhook_url: null

# Each WAN requires at least one allowed CIDR and one probe URL.
# URLs are tried in order and must be routed through the intended WAN interface.
servers:
  wan1:
    networks:
      - "218.0.0.0/8"
    urls:
      - "https://ifconfig.me/ip"
      - "https://ipinfo.io/ip"
      - "https://api-ipv4.ip.sb/ip"
  wan2:
    networks:
      - "120.0.0.0/8"
    urls:
      - "https://icanhazip.com"
      - "https://ipecho.net/plain"
      - "https://checkip.amazonaws.com"
